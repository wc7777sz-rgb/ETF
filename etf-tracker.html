<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票做T记录器（多档案版）</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #0f1923;
  color: #e0e0e0;
  min-height: 100vh;
  padding: 20px;
}
.container { max-width: 1100px; margin: 0 auto; }
h1 {
  text-align: center;
  font-size: 28px;
  margin-bottom: 20px;
  color: #4fc3f7;
  letter-spacing: 2px;
}
.card {
  background: #1a2634;
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 20px;
  border: 1px solid #2a3a4a;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
.card-title {
  font-size: 18px;
  color: #4fc3f7;
  margin-bottom: 16px;
  border-bottom: 1px solid #2a3a4a;
  padding-bottom: 10px;
}
.archive-bar {
  display: flex;
  gap: 12px;
  align-items: flex-end;
  flex-wrap: wrap;
  justify-content: space-between;
}
.archive-bar .input-group { flex: 1 1 260px; min-width: 220px; }
.archive-bar select { min-width: 100%; }
.archive-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}
.archive-actions .btn {
  flex: 1 1 auto;
  justify-content: center;
  display: inline-flex;
  align-items: center;
  min-width: 110px;
  padding: 10px 18px;
}
.btn {
  padding: 10px 22px;
  border: none;
  border-radius: 6px;
  font-size: 15px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.btn-buy { background: #2e7d32; color: #fff; }
.btn-buy:hover { background: #388e3c; }
.btn-sell { background: #c62828; color: #fff; }
.btn-sell:hover { background: #d32f2f; }
.btn-delete {
  background: #37474f;
  color: #b0bec5;
  font-size: 13px;
  padding: 5px 12px;
}
.btn-delete:hover { background: #455a64; color: #fff; }
.btn-export {
  background: #1565c0;
  color: #fff;
  font-size: 14px;
  padding: 8px 20px;
}
.btn-export:hover { background: #1976d2; }
.btn-clear {
  background: #5d4037;
  color: #fff;
  font-size: 14px;
  padding: 8px 20px;
}
.btn-clear:hover { background: #6d4c41; }
.btn-add {
  background: #00695c;
  color: #fff;
  font-size: 14px;
  padding: 8px 20px;
}
.btn-add:hover { background: #00796b; }
.btn-rename {
  background: #4e342e;
  color: #fff;
  font-size: 14px;
  padding: 8px 20px;
}
.btn-rename:hover { background: #5d4037; }
.btn-del-archive {
  background: #4a148c;
  color: #fff;
  font-size: 14px;
  padding: 8px 20px;
}
.btn-del-archive:hover { background: #6a1b9a; }
.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
}
.summary-item {
  background: #0f1923;
  border-radius: 8px;
  padding: 16px;
  text-align: center;
  border: 1px solid #2a3a4a;
}
.summary-item .label { font-size: 13px; color: #8a9baa; margin-bottom: 8px; }
.summary-item .value { font-size: 24px; font-weight: bold; }
.summary-item .value.green { color: #4caf50; }
.summary-item .value.red { color: #f44336; }
.summary-item .value.blue { color: #4fc3f7; }
.input-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: flex-end;
}
.input-group { flex: 1; min-width: 140px; }
.input-group label {
  display: block;
  font-size: 13px;
  color: #8a9baa;
  margin-bottom: 6px;
}
.input-group input, .input-group select {
  width: 100%;
  background: #0f1923;
  border: 1px solid #2a3a4a;
  border-radius: 6px;
  padding: 10px 12px;
  color: #e0e0e0;
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
}
.input-group input:focus, .input-group select:focus { border-color: #4fc3f7; }
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
}
th, td {
  padding: 10px 12px;
  text-align: center;
  border-bottom: 1px solid #2a3a4a;
  font-size: 14px;
}
th { color: #8a9baa; font-weight: 600; background: #0f1923; }
tr:hover { background: #1e2d3d; }
.type-buy { color: #4caf50; font-weight: bold; }
.type-sell { color: #f44336; font-weight: bold; }
.profit-green { color: #4caf50; font-weight: bold; }
.profit-red { color: #f44336; font-weight: bold; }
.actions-row {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  margin-top: 16px;
  flex-wrap: wrap;
}
.empty-tip {
  text-align: center;
  color: #5a6a7a;
  padding: 40px;
  font-size: 15px;
}
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #2e7d32;
  color: #fff;
  padding: 12px 32px;
  border-radius: 8px;
  font-size: 15px;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
.toast.error { background: #c62828; }
.toggle-row {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.toggle-btn {
  padding: 8px 24px;
  border: 1px solid #2a3a4a;
  background: #0f1923;
  color: #8a9baa;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s;
}
.toggle-btn.active {
  background: #1a2634;
  color: #4fc3f7;
  border-color: #4fc3f7;
}
#inputPanel { display: none; }
#inputPanel.show { display: block; }
.quick-stats {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.quick-stat {
  font-size: 13px;
  color: #8a9baa;
}
.quick-stat span { color: #4fc3f7; font-weight: bold; }
.archive-title {
  font-size: 20px;
  font-weight: bold;
  color: #ffb74d;
  margin-bottom: 4px;
}
.archive-sub {
  font-size: 13px;
  color: #8a9baa;
  margin-bottom: 16px;
}
.modal-mask {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.modal-mask.show { display: flex; }
.modal {
  background: #1a2634;
  border: 1px solid #2a3a4a;
  border-radius: 12px;
  padding: 24px;
  width: 90%;
  max-width: 400px;
}
.modal h3 { color: #4fc3f7; margin-bottom: 16px; font-size: 18px; }
.modal .modal-btns { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
.modal .btn-cancel { background: #37474f; color: #b0bec5; }
.modal .btn-cancel:hover { background: #455a64; color: #fff; }
</style>
</head>
<body>
<div class="container">
  <h1>📈 股票做T记录器</h1>

  <!-- 档案管理 -->
  <div class="card">
    <div class="card-title">🗂️ 持仓档案（支持多只股票）</div>
    <div class="archive-bar">
      <div class="input-group">
        <label>选择档案</label>
        <select id="archiveSelect" onchange="switchArchive()"></select>
      </div>
      <div class="archive-actions">
        <button class="btn btn-add" onclick="showAddArchive()">➕ 新增档案</button>
        <button class="btn btn-rename" onclick="showRenameArchive()">✏️ 重命名</button>
        <button class="btn btn-del-archive" onclick="deleteArchive()">🗑️ 删除档案</button>
      </div>
    </div>
  </div>

  <!-- 汇总卡片 -->
  <div class="card">
    <div class="archive-title" id="archiveName">-</div>
    <div class="archive-sub" id="archiveInfo"></div>
    <div class="card-title">📊 持仓汇总</div>
    <div class="summary-grid">
      <div class="summary-item">
        <div class="label">现存股数</div>
        <div class="value blue" id="totalShares">0</div>
      </div>
      <div class="summary-item">
        <div class="label">持仓成本</div>
        <div class="value blue" id="avgCost">¥0.0000</div>
      </div>
      <div class="summary-item">
        <div class="label">持仓市值</div>
        <div class="value blue" id="marketValue">¥0.00</div>
      </div>
      <div class="summary-item">
        <div class="label">浮动盈亏</div>
        <div class="value" id="floatingProfit">¥0.00</div>
      </div>
      <div class="summary-item">
        <div class="label">已实现盈亏</div>
        <div class="value" id="realizedProfit">¥0.00</div>
      </div>
      <div class="summary-item">
        <div class="label">总盈亏</div>
        <div class="value" id="totalProfit">¥0.00</div>
      </div>
    </div>
    <div style="margin-top:16px;">
      <div class="input-group" style="max-width:200px;">
        <label>当前市价（用于计算浮动盈亏）</label>
        <input type="number" id="currentPrice" step="0.001" placeholder="输入当前价格" oninput="onPriceChange()">
      </div>
    </div>
  </div>

  <!-- 录入面板 -->
  <div class="card">
    <div class="toggle-row">
      <button class="toggle-btn active" id="toggleBuy" onclick="switchType('buy')">买入</button>
      <button class="toggle-btn" id="toggleSell" onclick="switchType('sell')">卖出</button>
    </div>
    <div id="inputPanel" class="show">
      <div class="input-row">
        <div class="input-group">
          <label>日期</label>
          <input type="date" id="tradeDate">
        </div>
        <div class="input-group">
          <label>价格（元）</label>
          <input type="number" id="tradePrice" step="0.001" placeholder="如 1.234">
        </div>
        <div class="input-group">
          <label>股数</label>
          <input type="number" id="tradeShares" step="1" placeholder="如 1000">
        </div>
        <div class="input-group">
          <label>手续费（元，可选）</label>
          <input type="number" id="tradeFee" step="0.01" placeholder="默认0" value="0">
        </div>
        <button class="btn btn-buy" id="submitBtn" onclick="addTrade()">确认买入</button>
      </div>
    </div>
  </div>

  <!-- 交易记录 -->
  <div class="card">
    <div class="card-title">📋 交易记录</div>
    <div class="quick-stats">
      <div class="quick-stat">买入次数: <span id="buyCount">0</span></div>
      <div class="quick-stat">卖出次数: <span id="sellCount">0</span></div>
      <div class="quick-stat">买入总额: <span id="buyTotal">¥0.00</span></div>
      <div class="quick-stat">卖出总额: <span id="sellTotal">¥0.00</span></div>
    </div>
    <div id="tableWrap">
      <div class="empty-tip" id="emptyTip">暂无交易记录，请先录入买入/卖出数据</div>
      <table id="tradeTable" style="display:none;">
        <thead>
          <tr>
            <th>#</th>
            <th>日期</th>
            <th>类型</th>
            <th>价格</th>
            <th>股数</th>
            <th>金额</th>
            <th>手续费</th>
            <th>本次盈亏</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tradeBody"></tbody>
      </table>
    </div>
    <div class="actions-row">
      <button class="btn btn-export" onclick="exportData()">导出数据</button>
      <button class="btn btn-clear" onclick="clearAll()">清空当前档案记录</button>
    </div>
  </div>
</div>

<!-- 新增档案弹窗 -->
<div class="modal-mask" id="addModal">
  <div class="modal">
    <h3>新增持仓档案</h3>
    <div class="input-group">
      <label>档案名称（如：贵州茅台、600519）</label>
      <input type="text" id="newArchiveName" placeholder="请输入股票名称/代码" maxlength="30">
    </div>
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="hideAddModal()">取消</button>
      <button class="btn btn-add" onclick="doAddArchive()">确认新增</button>
    </div>
  </div>
</div>

<!-- 重命名弹窗 -->
<div class="modal-mask" id="renameModal">
  <div class="modal">
    <h3>重命名档案</h3>
    <div class="input-group">
      <label>新名称</label>
      <input type="text" id="renameInput" placeholder="请输入新名称" maxlength="30">
    </div>
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="hideRenameModal()">取消</button>
      <button class="btn btn-add" onclick="doRenameArchive()">确认重命名</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var STORAGE_KEY = 'etf_tracker_data_v2';
var LEGACY_KEY = 'etf_tracker_records';
var currentType = 'buy';
var archives = [];
var currentArchiveId = null;

function getCurrentArchive() {
  for (var i = 0; i < archives.length; i++) {
    if (archives[i].id === currentArchiveId) return archives[i];
  }
  return null;
}

function init() {
  loadData();
  var today = new Date();
  var dateStr = today.getFullYear() + '-' +
    String(today.getMonth() + 1).padStart(2, '0') + '-' +
    String(today.getDate()).padStart(2, '0');
  document.getElementById('tradeDate').value = dateStr;
  renderArchiveSelect();
  refreshAll();
}

function loadData() {
  var saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      var data = JSON.parse(saved);
      archives = Array.isArray(data.archives) ? data.archives : [];
      currentArchiveId = data.currentArchiveId || null;
      if (archives.length > 0) {
        var ok = false;
        for (var i = 0; i < archives.length; i++) {
          if (archives[i].id === currentArchiveId) { ok = true; break; }
        }
        if (!ok) currentArchiveId = archives[0].id;
      }
    } catch(e) {
      archives = [];
      currentArchiveId = null;
    }
  } else {
    var legacy = localStorage.getItem(LEGACY_KEY);
    if (legacy) {
      try {
        var oldRecords = JSON.parse(legacy);
        if (Array.isArray(oldRecords)) {
          var a = {
            id: 'a_' + Date.now(),
            name: '默认持仓',
            records: oldRecords,
            currentPrice: ''
          };
          archives = [a];
          currentArchiveId = a.id;
          localStorage.removeItem(LEGACY_KEY);
        }
      } catch(e2) {
        /* ignore */
      }
    }
  }
  if (archives.length === 0) {
    var def = {
      id: 'a_' + Date.now(),
      name: '默认持仓',
      records: [],
      currentPrice: ''
    };
    archives = [def];
    currentArchiveId = def.id;
  }
  saveData();
}

function saveData() {
  var data = { archives: archives, currentArchiveId: currentArchiveId };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

/* ---------- 档案管理 ---------- */

function renderArchiveSelect() {
  var sel = document.getElementById('archiveSelect');
  var html = '';
  for (var i = 0; i < archives.length; i++) {
    var recCount = archives[i].records.length;
    html += '<option value="' + archives[i].id + '"' +
      (archives[i].id === currentArchiveId ? ' selected' : '') + '>' +
      escHtml(archives[i].name) + '（' + recCount + '条记录）</option>';
  }
  sel.innerHTML = html;
}

function switchArchive() {
  var sel = document.getElementById('archiveSelect');
  currentArchiveId = sel.value;
  saveData();
  refreshAll();
  showToast('已切换到当前档案');
}

function showAddArchive() {
  document.getElementById('newArchiveName').value = '';
  document.getElementById('addModal').className = 'modal-mask show';
  document.getElementById('newArchiveName').focus();
}

function hideAddModal() {
  document.getElementById('addModal').className = 'modal-mask';
}

function doAddArchive() {
  var name = document.getElementById('newArchiveName').value.trim();
  if (!name) { showToast('请输入档案名称', true); return; }
  var a = {
    id: 'a_' + Date.now() + '_' + Math.floor(Math.random() * 10000),
    name: name,
    records: [],
    currentPrice: ''
  };
  archives.push(a);
  currentArchiveId = a.id;
  saveData();
  renderArchiveSelect();
  document.getElementById('currentPrice').value = '';
  refreshAll();
  hideAddModal();
  showToast('新档案「' + name + '」已创建');
}

function showRenameArchive() {
  var a = getCurrentArchive();
  if (!a) return;
  document.getElementById('renameInput').value = a.name;
  document.getElementById('renameModal').className = 'modal-mask show';
  document.getElementById('renameInput').focus();
}

function hideRenameModal() {
  document.getElementById('renameModal').className = 'modal-mask';
}

function doRenameArchive() {
  var a = getCurrentArchive();
  if (!a) return;
  var name = document.getElementById('renameInput').value.trim();
  if (!name) { showToast('请输入名称', true); return; }
  a.name = name;
  saveData();
  renderArchiveSelect();
  refreshAll();
  hideRenameModal();
  showToast('已重命名');
}

function deleteArchive() {
  var a = getCurrentArchive();
  if (!a) return;
  if (archives.length <= 1) {
    showToast('至少保留一个档案，无法删除', true);
    return;
  }
  if (!confirm('确认删除档案「' + a.name + '」？该档案的全部记录将删除，不可恢复！')) return;
  archives = archives.filter(function(x) { return x.id !== a.id; });
  currentArchiveId = archives[0].id;
  saveData();
  renderArchiveSelect();
  refreshAll();
  showToast('档案已删除');
}

/* ---------- 交易录入 ---------- */

function switchType(type) {
  currentType = type;
  var toggleBuy = document.getElementById('toggleBuy');
  var toggleSell = document.getElementById('toggleSell');
  var submitBtn = document.getElementById('submitBtn');
  if (type === 'buy') {
    toggleBuy.classList.add('active');
    toggleSell.classList.remove('active');
    submitBtn.className = 'btn btn-buy';
    submitBtn.textContent = '确认买入';
  } else {
    toggleSell.classList.add('active');
    toggleBuy.classList.remove('active');
    submitBtn.className = 'btn btn-sell';
    submitBtn.textContent = '确认卖出';
  }
}

function addTrade() {
  var date = document.getElementById('tradeDate').value;
  var price = parseFloat(document.getElementById('tradePrice').value);
  var shares = parseInt(document.getElementById('tradeShares').value);
  var fee = parseFloat(document.getElementById('tradeFee').value) || 0;

  if (!date) { showToast('请选择日期', true); return; }
  if (isNaN(price) || price <= 0) { showToast('请输入有效价格', true); return; }
  if (isNaN(shares) || shares <= 0) { showToast('请输入有效股数', true); return; }

  var a = getCurrentArchive();
  if (!a) return;

  if (currentType === 'sell') {
    var currentShares = calcCurrentShares(a.records);
    if (shares > currentShares) {
      showToast('卖出股数超过现存股数（' + currentShares + '股）', true);
      return;
    }
  }

  var record = {
    id: Date.now() + '_' + Math.floor(Math.random() * 100000),
    date: date,
    type: currentType,
    price: price,
    shares: shares,
    fee: fee,
    timestamp: Date.now()
  };

  a.records.push(record);
  saveData();
  renderArchiveSelect();
  refreshAll();

  document.getElementById('tradePrice').value = '';
  document.getElementById('tradeShares').value = '';
  document.getElementById('tradeFee').value = '0';

  showToast(currentType === 'buy' ? '买入记录已添加' : '卖出记录已添加');
}

function onPriceChange() {
  var a = getCurrentArchive();
  if (!a) return;
  a.currentPrice = document.getElementById('currentPrice').value;
  saveData();
  updateSummary();
}

/* ---------- 计算 ---------- */

function calcCurrentShares(records) {
  var total = 0;
  for (var i = 0; i < records.length; i++) {
    if (records[i].type === 'buy') {
      total += records[i].shares;
    } else {
      total -= records[i].shares;
    }
  }
  return total;
}

function calcAvgCost(records) {
  var buyTotal = 0;
  var buyShares = 0;
  for (var i = 0; i < records.length; i++) {
    if (records[i].type === 'buy') {
      buyTotal += records[i].price * records[i].shares + records[i].fee;
      buyShares += records[i].shares;
    }
  }

  var remainingShares = calcCurrentShares(records);
  if (remainingShares <= 0 || buyShares === 0) return 0;

  var soldShares = buyShares - remainingShares;
  var avgBuyPrice = buyTotal / buyShares;
  var soldCost = soldShares * avgBuyPrice;
  var remainingCost = buyTotal - soldCost;

  return remainingCost / remainingShares;
}

function calcRealizedProfit(records) {
  var buyTotal = 0;
  var buyShares = 0;
  var sellTotal = 0;
  var sellShares = 0;
  var allFees = 0;

  for (var i = 0; i < records.length; i++) {
    var r = records[i];
    allFees += r.fee;
    if (r.type === 'buy') {
      buyTotal += r.price * r.shares;
      buyShares += r.shares;
    } else {
      sellTotal += r.price * r.shares;
      sellShares += r.shares;
    }
  }

  if (buyShares === 0) return 0;

  var avgBuyPrice = buyTotal / buyShares;
  var realizedProfit = sellTotal - sellShares * avgBuyPrice - allFees;
  return realizedProfit;
}

function calcEachRealizedProfit(records) {
  var buyTotal = 0;
  var buyShares = 0;

  for (var i = 0; i < records.length; i++) {
    var r = records[i];
    if (r.type === 'buy') {
      buyTotal += r.price * r.shares + r.fee;
      buyShares += r.shares;
    }
  }

  var avgBuyPrice = buyShares > 0 ? buyTotal / buyShares : 0;

  var results = [];
  for (var j = 0; j < records.length; j++) {
    var rec = records[j];
    if (rec.type === 'buy') {
      results.push(null);
    } else {
      var profit = rec.price * rec.shares - avgBuyPrice * rec.shares - rec.fee;
      results.push(profit);
    }
  }
  return results;
}

/* ---------- 渲染 ---------- */

function refreshAll() {
  var a = getCurrentArchive();
  var records = a ? a.records : [];
  document.getElementById('archiveName').textContent = a ? a.name : '-';
  document.getElementById('archiveInfo').textContent = a ?
    '记录数：' + records.length + ' 条 ｜ 历史记录永久保留' : '';
  document.getElementById('currentPrice').value = a && a.currentPrice ? a.currentPrice : '';
  renderTable(records);
  updateSummary();
}

function updateSummary() {
  var a = getCurrentArchive();
  var records = a ? a.records : [];
  var currentShares = calcCurrentShares(records);
  var avgCost = calcAvgCost(records);
  var realized = calcRealizedProfit(records);
  var currentPrice = parseFloat(document.getElementById('currentPrice').value) || 0;
  var marketValue = currentShares * currentPrice;
  var floating = currentShares > 0 && currentPrice > 0
    ? (currentPrice - avgCost) * currentShares
    : 0;
  var totalProfit = realized + floating;

  document.getElementById('totalShares').textContent = currentShares.toLocaleString();
  document.getElementById('avgCost').textContent = '\uFFE5' + avgCost.toFixed(4);
  document.getElementById('marketValue').textContent = '\uFFE5' + marketValue.toFixed(2);

  setProfitColor('floatingProfit', floating);
  setProfitColor('realizedProfit', realized);
  setProfitColor('totalProfit', totalProfit);

  var buyCount = 0, sellCount = 0, buyTotal = 0, sellTotal = 0;
  for (var i = 0; i < records.length; i++) {
    if (records[i].type === 'buy') {
      buyCount++;
      buyTotal += records[i].price * records[i].shares;
    } else {
      sellCount++;
      sellTotal += records[i].price * records[i].shares;
    }
  }
  document.getElementById('buyCount').textContent = buyCount;
  document.getElementById('sellCount').textContent = sellCount;
  document.getElementById('buyTotal').textContent = '\uFFE5' + buyTotal.toFixed(2);
  document.getElementById('sellTotal').textContent = '\uFFE5' + sellTotal.toFixed(2);
}

function setProfitColor(id, value) {
  var el = document.getElementById(id);
  if (value > 0) {
    el.className = 'value green';
    el.textContent = '\uFFE5' + value.toFixed(2);
  } else if (value < 0) {
    el.className = 'value red';
    el.textContent = '\uFFE5' + value.toFixed(2);
  } else {
    el.className = 'value blue';
    el.textContent = '\uFFE5' + value.toFixed(2);
  }
}

function renderTable(records) {
  var tbody = document.getElementById('tradeBody');
  var table = document.getElementById('tradeTable');
  var emptyTip = document.getElementById('emptyTip');

  if (!records || records.length === 0) {
    table.style.display = 'none';
    emptyTip.style.display = 'block';
    tbody.innerHTML = '';
    return;
  }

  table.style.display = 'table';
  emptyTip.style.display = 'none';

  var sorted = records.slice().sort(function(a, b) {
    return b.timestamp - a.timestamp;
  });

  var eachProfits = calcEachRealizedProfit(records);
  var profitMap = {};
  for (var m = 0; m < records.length; m++) {
    profitMap[String(records[m].id)] = eachProfits[m];
  }

  var html = '';
  for (var i = 0; i < sorted.length; i++) {
    var r = sorted[i];
    var amount = r.price * r.shares;
    var profit = profitMap[String(r.id)];
    var profitStr = '';
    var profitClass = '';
    if (r.type === 'sell' && profit !== null && profit !== undefined) {
      profitStr = (profit >= 0 ? '+' : '') + '\uFFE5' + profit.toFixed(2);
      profitClass = profit >= 0 ? 'profit-green' : 'profit-red';
    } else {
      profitStr = '-';
    }

    html += '<tr>' +
      '<td>' + (i + 1) + '</td>' +
      '<td>' + escHtml(String(r.date)) + '</td>' +
      '<td class="' + (r.type === 'buy' ? 'type-buy' : 'type-sell') + '">' +
        (r.type === 'buy' ? '买入' : '卖出') + '</td>' +
      '<td>' + r.price.toFixed(3) + '</td>' +
      '<td>' + r.shares.toLocaleString() + '</td>' +
      '<td>\uFFE5' + amount.toFixed(2) + '</td>' +
      '<td>\uFFE5' + r.fee.toFixed(2) + '</td>' +
      '<td class="' + profitClass + '">' + profitStr + '</td>' +
      '<td><button class="btn btn-delete" data-id="' + r.id + '">删除</button></td>' +
      '</tr>';
  }
  tbody.innerHTML = html;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ---------- 记录操作 ---------- */

function deleteRecord(id) {
  var a = getCurrentArchive();
  if (!a) return;
  if (!confirm('确认删除这条记录？')) return;
  a.records = a.records.filter(function(r) { return String(r.id) !== String(id); });
  saveData();
  renderArchiveSelect();
  refreshAll();
  showToast('记录已删除');
}

function clearAll() {
  var a = getCurrentArchive();
  if (!a) return;
  if (a.records.length === 0) { showToast('当前档案没有记录可清空', true); return; }
  if (!confirm('确认清空当前档案「' + a.name + '」的全部记录？此操作不可恢复！')) return;
  if (!confirm('再次确认：真的要清空全部交易记录吗？')) return;
  a.records = [];
  saveData();
  renderArchiveSelect();
  refreshAll();
  showToast('当前档案记录已清空');
}

function exportData() {
  var dataStr = JSON.stringify({ archives: archives, currentArchiveId: currentArchiveId }, null, 2);
  var blob = new Blob([dataStr], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'etf_archives_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('全部档案数据已导出');
}

function showToast(msg, isError) {
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(function() {
    toast.className = 'toast' + (isError ? ' error' : '');
  }, 2500);
}

/* 事件委托：删除记录按钮 */
document.getElementById('tradeBody').addEventListener('click', function(e) {
  var btn = e.target;
  if (btn && btn.classList && btn.classList.contains('btn-delete')) {
    deleteRecord(btn.getAttribute('data-id'));
  }
});

/* Enter 提交 */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    var t = e.target;
    if (t && (t.id === 'tradePrice' || t.id === 'tradeShares' || t.id === 'tradeFee')) {
      addTrade();
    }
  }
});

init();
</script>
